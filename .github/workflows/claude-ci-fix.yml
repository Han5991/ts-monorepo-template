name: Claude CI fix

# PR의 CI가 실패하면 Claude가 원인을 고치고, 검사가 통과하면 자동 머지를 건다.
#
# - Claude는 파일만 고친다. 커밋·push는 아래 스텝이 한다 — 전체 검사를 다시 돌려 초록일 때만, 우회 흔적이 없을 때만.
# - 기본 토큰(GITHUB_TOKEN)으로 한 push의 PR 이벤트 실행은 "승인 대기(action_required)"로 생긴다. push 뒤 그 실행
#   (CI·Template init)을 API로 승인해야 돌고, 그 체크가 브랜치 보호의 필수 체크를 채운다. workflow_dispatch로 다시
#   돌린 체크는 PR 필수 체크로 인정되지 않는다(2026-11-09 PR #2에서 확인).
# - 한 번만 시도한다: 이 잡이 push한 커밋(actor github-actions[bot])의 CI가 다시 실패해도 반응하지 않는다.
#   그래도 실패하면 PR이 열린 채로 남는다.
# - 같은 저장소의 브랜치만 다룬다 — 포크의 코드를 secret과 쓰기 토큰을 가진 채 실행하지 않는다.

on:
  workflow_run:
    workflows: ['CI', 'Template init']
    types: [completed]

jobs:
  fix:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login != 'github-actions[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40

    concurrency:
      group: claude-ci-fix-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false

    permissions:
      contents: write
      pull-requests: write
      actions: write
      id-token: write

    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      # 실패한 뒤 브랜치가 더 나아갔으면(새 push) 그 push의 CI가 따로 돈다 — 옛 실패는 고치지 않는다
      - name: Check the branch did not move
        id: pr
        run: |
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "브랜치가 실패한 커밋 뒤로 나아갔다 — 건너뛴다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            echo "열린 PR이 없다 — 건너뛴다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Setup workspace
        if: steps.pr.outputs.skip != 'true'
        uses: ./.github/actions/setup

      - name: Collect failure log
        if: steps.pr.outputs.skip != 'true'
        run: gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed | tail -n 400 > "$RUNNER_TEMP/ci-failure.log"

      - name: Run Claude
        id: claude
        if: steps.pr.outputs.skip != 'true'
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 이 잡은 GitHub에 쓰지 않는다(커밋·코멘트는 아래 스텝) — 앱 토큰 대신 이 실행의 토큰을 넘긴다
          github_token: ${{ github.token }}
          # Renovate PR의 CI 실패도 고친다 — 액션은 사람이 아닌 actor를 기본으로 거부한다
          allowed_bots: 'renovate[bot]'
          display_report: true
          prompt: |
            모든 설명은 한글로 쓴다.

            REPO: ${{ github.repository }}
            PR: #${{ steps.pr.outputs.number }} (브랜치 ${{ github.event.workflow_run.head_branch }})
            실패한 CI: ${{ github.event.workflow_run.name }} — ${{ github.event.workflow_run.html_url }}
            실패 로그(끝 400줄): ${{ runner.temp }}/ci-failure.log

            이 PR의 CI가 실패했다. 원인을 찾아 **작업 트리의 파일을 고친다.** 커밋·push·코멘트는 하지 않는다 —
            이 잡의 다음 스텝이 검사를 다시 돌려 통과할 때만 커밋한다.

            <rules>
            - 먼저 AGENTS.md와 관련 docs/adr를 읽는다. 저장소의 규칙이 이 지시보다 우선한다.
            - 고친다는 것은 원인을 고치는 것이다. 다음은 하지 않는다: 인라인 eslint 주석, `as`·`!`·`any`로 타입 오류 덮기,
              테스트 삭제·`.skip`·`.only`, 단언을 실패에 맞춰 바꾸기, lint·tsconfig 규칙을 끄거나 예외 넓히기,
              `.github/` 수정(이 토큰으로는 push할 수 없다).
            - 의존성 업데이트 PR이면: 실패가 새 버전의 breaking change 때문인지 확인하고(릴리스 노트·타입 정의), 우리 코드를
              새 API에 맞춘다. 고칠 수 없으면(상위 버그·호환 안 되는 peer 등) 아무것도 고치지 말고 이유만 남긴다.
            - 고친 뒤 직접 확인한다: `pnpm install`이 필요하면 하고,
              `pnpm turbo run lint check-types test`, `pnpm check-types:tooling`, `pnpm lint:tooling`, `pnpm format`.
            </rules>

            <single_turn>
            이 실행은 단발성이다. 백그라운드 작업이나 서브에이전트를 기다리지 않는다. 모든 조사와 수정을 이 턴 안에서 끝낸다.
            </single_turn>

            끝나면 Write 도구로 `ci-fix-summary.md`를 쓴다(저장소 루트, 커밋되지 않는다):
            ## CI 실패 원인
            (한두 문장)
            ## 고친 것
            (파일별 한 줄, 고치지 못했으면 그 이유)
          claude_args: >-
            --model claude-opus-5-5
            --allowed-tools
            "Read,Grep,Glob,Edit,Write,Bash(pnpm:*),Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(cat:*),Bash(tail:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
            --disallowed-tools
            "Task,ScheduleWakeup,TaskOutput,TaskStop"

      - name: Show Claude error
        if: always() && steps.claude.outcome == 'failure' && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: python3 .github/scripts/claude-result-error.py "$EXECUTION_FILE"

      # 결정적 관문: 우회 흔적이 있거나 검사가 실패하면 push하지 않는다
      - name: Verify the fix
        id: verify
        if: steps.pr.outputs.skip != 'true' && steps.claude.outcome == 'success'
        run: |
          set -uo pipefail
          mv ci-fix-summary.md "$RUNNER_TEMP/summary.md" 2>/dev/null || echo "(Claude가 요약을 남기지 않았다)" > "$RUNNER_TEMP/summary.md"
          git add -A
          if git diff --cached --quiet; then
            echo "result=nochange" >> "$GITHUB_OUTPUT"; exit 0
          fi
          reasons=()
          git diff --cached --name-only | grep -q '^\.github/' && reasons+=(".github/ 수정")
          git diff --cached --name-status | grep -qE '^D\s+.*\.(test|spec)\.' && reasons+=("테스트 파일 삭제")
          git diff --cached -U0 | grep -E '^\+' | grep -qE '\b(it|test|describe)\.(skip|only)\(' && reasons+=("테스트 skip·only")
          if [ ${#reasons[@]} -gt 0 ]; then
            echo "result=rejected" >> "$GITHUB_OUTPUT"
            echo "why=${reasons[*]}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if pnpm turbo run lint check-types test && pnpm check-types:tooling && pnpm lint:tooling && pnpm format:check; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Push, run CI, enable auto-merge
        if: steps.verify.outputs.result == 'pass'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "fix(ci): CI 실패를 고친다" -m "실패한 실행: $RUN_URL"
          git push -q origin "HEAD:$BRANCH"
          head="$(git rev-parse HEAD)"
          # 봇 push의 PR 이벤트 실행은 승인 대기로 생긴다 — 필수 체크인 CI·Template init만 승인한다
          # (Claude 코드 리뷰는 봇 actor를 거부하므로 승인하지 않는다). 실행이 생길 때까지 잠시 기다린다
          approved=0
          for _ in $(seq 1 18); do
            ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$head&event=pull_request&status=action_required" \
              --jq '.workflow_runs[] | select(.name == "CI" or .name == "Template init") | .id')"
            for id in $ids; do
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" >/dev/null && approved=$((approved + 1))
            done
            want=1; [ -f .github/workflows/template-init.yml ] && want=2
            [ "$approved" -ge "$want" ] && break
            sleep 5
          done
          echo "승인한 실행: $approved"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash
          { echo "## CI를 고쳤다"; echo; cat "$RUNNER_TEMP/summary.md"; echo; echo "검사가 다시 통과하면 자동으로 머지된다. 실패한 실행: $RUN_URL"; } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"

      - name: Report when not fixed
        if: steps.verify.outputs.result == 'nochange' || steps.verify.outputs.result == 'rejected' || steps.verify.outputs.result == 'fail' || steps.claude.outcome == 'failure'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RESULT: ${{ steps.verify.outputs.result || 'claude-failed' }}
          WHY: ${{ steps.verify.outputs.why }}
        run: |
          case "$RESULT" in
            nochange) title="고칠 것을 찾지 못했다(또는 고칠 수 없다고 판단했다)";;
            rejected) title="고친 내용에 우회 흔적이 있어 push하지 않았다: $WHY";;
            fail) title="고쳤지만 검사가 여전히 실패해 push하지 않았다";;
            *) title="Claude 실행이 실패했다";;
          esac
          { echo "## CI 자동 수정 실패 — $title"; echo; cat "$RUNNER_TEMP/summary.md" 2>/dev/null; echo; echo "실패한 실행: $RUN_URL · 수정 시도: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
