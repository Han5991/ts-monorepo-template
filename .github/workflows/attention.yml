name: Attention

# 사람이 봐야 할 것을 하루 한 번 이슈 하나("사람이 볼 것")에 모은다. 새 항목이 생겼을 때만 저장소 주인을 @멘션한다 —
# 저장소 알림을 "참여·멘션만"으로 두면 평소엔 메일이 없고, 사람이 필요한 날만 한 통 온다.
# 볼 것이 없어져도 이슈를 닫지 않고 본문만 "지금은 없다"로 바꾼다 — 한 번 멘션되면 그 이슈를 구독하게 되어
# 닫기·다시 열기마다 알림이 가기 때문이다(본문 수정은 알림이 없다). 닫혀 있으면 볼 것이 생길 때만 다시 연다.
# LLM 없음. 기본 토큰으로 읽고, 이슈만 쓴다.
#
# 모으는 것:
#   - CI 자동 수정이 실패한 열린 PR(claude-ci-fix의 "CI 자동 수정 실패" 코멘트)
#   - 하루 넘게 열려 있는 의존성 PR(자동 머지가 안 된 것 — 체크 실패·사람 머지 대기)
#   - 기본 브랜치에서 직전 실행 뒤로 끝난 실패 워크플로(Claude 인증 만료 같은 것도 여기 걸린다)
#
# 멘션 대상은 저장소 변수 ATTENTION_MENTION(없으면 저장소 주인).

on:
  schedule:
    # 매일 08:00 KST (23:00 UTC 전날)
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: attention
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      MENTION: ${{ vars.ATTENTION_MENTION || github.repository_owner }}
      LABEL: attention
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect items
        run: |
          set -euo pipefail
          items="$RUNNER_TEMP/items.tsv"   # 키<TAB>한 줄 설명
          : > "$items"
          # gh의 --jq는 --arg를 받지 않는다 — 환경 변수(env.DAY_AGO, env.SINCE)로 넘긴다
          DAY_AGO="$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          # 실패 워크플로를 볼 구간의 시작은 기본 브랜치에서 직전에 성공한 이 워크플로 실행 시각이다. 예약 실행은 몇 시간씩
          # 늦게 돌기도 해서 "24시간 전"으로 자르면 구간이 겹치거나(같은 실패가 이틀 잡힘) 빈다(실패가 빠짐).
          # 진행 중인 이 실행은 아직 success가 아니라 잡히지 않는다. 처음 돌 때는 24시간 전부터 본다
          SINCE="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow attention.yml --branch "${{ github.event.repository.default_branch }}" \
            --status success --limit 1 --json createdAt --jq '.[0].createdAt // empty')"
          SINCE="${SINCE:-$DAY_AGO}"
          export DAY_AGO SINCE
          echo "실패 워크플로 구간: $SINCE 이후"

          # 1) CI 자동 수정이 실패한 열린 PR
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title,url,comments \
            --jq '.[] | select(any(.comments[]; .author.login == "github-actions" and (.body | startswith("## CI 자동 수정 실패")))) | "fixfail-\(.number)\tCI 자동 수정 실패: [#\(.number)](\(.url)) \(.title)"' >> "$items"

          # 2) 하루 넘게 열린 의존성 PR(Renovate·의존성 점검 봇)
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title,url,createdAt,labels,headRefName \
            --jq '.[] | select(.createdAt < env.DAY_AGO) | select((.labels | any(.name == "dependencies")) or (.headRefName | startswith("claude/deps-audit-"))) | "deps-\(.number)\t머지 안 된 의존성 PR: [#\(.number)](\(.url)) \(.title)"' >> "$items"

          # 3) 기본 브랜치에서 직전 실행 뒤로 끝난 워크플로(이 워크플로 제외) 중, 워크플로마다 가장 최근 것이 실패한 것.
          #    시작 시각이 아니라 끝난 시각(updatedAt)으로 거른다 — 직전 실행 때 아직 돌고 있던 것이 빠지지 않게
          gh run list --repo "$GITHUB_REPOSITORY" --branch "${{ github.event.repository.default_branch }}" --limit 50 \
            --json databaseId,workflowName,status,conclusion,createdAt,updatedAt,url \
            --jq '[.[] | select(.status == "completed" and .updatedAt >= env.SINCE and .workflowName != "Attention")] | group_by(.workflowName) | .[] | max_by(.createdAt) | select(.conclusion == "failure") | "run-\(.workflowName | gsub("[^A-Za-z0-9]"; "-"))-\(.databaseId)\t기본 브랜치에서 실패: [\(.workflowName)](\(.url))"' >> "$items"

          sort -u -o "$items" "$items"
          echo "항목 $(wc -l < "$items")개"
          cat "$items"

      - name: Update the issue
        run: |
          set -euo pipefail
          items="$RUNNER_TEMP/items.tsv"
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" --color D93F0B --description '사람이 볼 것(attention.yml)' 2>/dev/null || true
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state all --limit 1 --json number --jq '.[0].number // empty')"

          # 지난번에 알린 키(본문 끝의 숨은 주석)
          prev=""
          if [[ -n "$issue" ]]; then
            prev="$(gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' | sed -n 's/^<!-- keys: \(.*\) -->$/\1/p' | tr ',' '\n')"
          fi
          keys="$(cut -f1 "$items")"
          # fixfail-은 claude-ci-fix가 실패할 때 이미 멘션했다 — 목록에는 두되 다시 멘션하지 않는다
          new="$(comm -13 <(printf '%s\n' "$prev" | sort -u) <(printf '%s\n' "$keys" | sort -u) | grep -v '^fixfail-' | grep . || true)"

          body="$RUNNER_TEMP/body.md"
          {
            echo "자동으로 처리하지 못해 사람이 볼 것. 매일 아침 \`attention.yml\`이 다시 만든다 — 손으로 고치지 않는다."
            echo
            if [[ -s "$items" ]]; then cut -f2 "$items" | sed 's/^/- [ ] /'; else echo "지금은 없다."; fi
            echo
            echo "<!-- keys: $(printf '%s' "$keys" | paste -sd ',' -) -->"
          } > "$body"

          if [[ -z "$issue" ]]; then
            [[ -s "$items" ]] || { echo "볼 것 없음 — 이슈를 만들지 않는다"; exit 0; }
            issue="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "사람이 볼 것" --label "$LABEL" --body-file "$body" | sed 's#.*/##')"
          else
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          fi

          # 닫지 않는다(맨 위 설명). 볼 것이 있는데 닫혀 있을 때만 다시 연다
          if [[ -s "$items" && "$(gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')" == "CLOSED" ]]; then
            gh issue reopen "$issue" --repo "$GITHUB_REPOSITORY"
          fi

          # 새 항목이 있을 때만 멘션한다 — 같은 항목으로 매일 메일이 가지 않게
          if [[ -n "$new" ]]; then
            {
              echo "@$MENTION 새로 볼 것이 생겼다:"
              echo
              awk -F'\t' 'NR == FNR { want[$0] = 1; next } want[$1] { print "- " $2 }' <(printf '%s\n' "$new") "$items"
            } > "$RUNNER_TEMP/comment.md"
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          fi
